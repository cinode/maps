{{- if eq (include "osm-machinery.mapType" $) "vector" }}
{{- $defaultSecret := print $.Release.Name "-vector-map-secret" }}
{{- $secrets := dict }}
{{- range $cfg := list $.Values.vectorMap.datastore $.Values.vectorMap.writerInfo }}
{{-   if and $cfg.value (not $cfg.existingSecret) }}
{{-     $name := $cfg.secretName | default $defaultSecret }}
{{-     $data := get $secrets $name | default dict }}
{{-     $_ := set $data $cfg.secretKey ($cfg.value | b64enc) }}
{{-     $_ := set $secrets $name $data }}
{{-   end }}
{{- end }}
{{- range $name, $data := $secrets }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name | quote }}
type: Opaque
data: {{- $data | toYaml | nindent 2 }}
{{- end }}
{{- end }}
