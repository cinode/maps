---
# Default values for osm-machinery.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  # Tuning of PostgreSQL and of the initial osm2pgsql import of the raster
  # map. Settings come from the selected profile, each of them can also be
  # overridden individually, e.g.:
  #   global.importTuning.profiles.optimized.osm2pgsql.cache=6000
  # It is a global value since it is also used by the PostgreSQL subchart,
  # in umbrella charts it must be set in the top-level global section.
  importTuning:
    # minimal   - small extracts (e.g. Luxembourg), local tests in minikube
    # optimized - large extracts on a dedicated machine with >= 16GB of RAM
    profile: minimal

    # Disables crash safety of PostgreSQL (fsync, full_page_writes,
    # synchronous_commit) which speeds up writes, mostly on slow disks.
    # A crash of PostgreSQL or of the machine can corrupt the database,
    # which then has to be imported again.
    noSync: false

    profiles:
      minimal:
        osm2pgsql:
          # Node cache in MB (-C). Node locations missing in the cache are
          # looked up from the database which makes processing of ways very
          # slow. It should ideally hold all nodes of the imported extract
          # (osm2pgsql 1.6 needs ~5-9 bytes per node) but must leave enough
          # memory for PostgreSQL.
          cache: 800
          # Number of osm2pgsql processes (--number-processes)
          threads: 2
          # Additional arguments, e.g. "--disable-parallel-indexing" to build
          # indexes one by one on machines with slow disks or low memory
          extraArgs: ""
        # Settings of the import sessions (osm2pgsql, index creation) passed
        # through PGOPTIONS, they don't need PostgreSQL restart. Indexes of
        # multiple tables are built in parallel, each of them can use up to
        # maintenance_work_mem.
        session:
          maintenance_work_mem: 256MB
          work_mem: 128MB
        # PostgreSQL server settings, changing them restarts PostgreSQL which
        # aborts a running import
        postgres:
          shared_buffers: 128MB
          maintenance_work_mem: 256MB
          max_wal_size: 2880MB
          checkpoint_timeout: 5min
          checkpoint_completion_target: 0.9
          # No replication is used, tables created and loaded in the same
          # transaction (clustering of output tables) skip WAL entirely
          wal_level: minimal
          max_wal_senders: 0

      # Based on the recommendations of the osm2pgsql manual:
      # https://osm2pgsql.org/doc/manual.html#preparing-the-database
      optimized:
        osm2pgsql:
          cache: 8000
          threads: 2
          extraArgs: ""
        session:
          maintenance_work_mem: 1GB
          work_mem: 256MB
        postgres:
          shared_buffers: 1GB
          maintenance_work_mem: 1GB
          max_wal_size: 10GB
          checkpoint_timeout: 30min
          checkpoint_completion_target: 0.9
          wal_level: minimal
          max_wal_senders: 0

# Type of the generated map:
#  * raster - PNG tiles rendered by the tile server from OSM data imported
#             into PostgreSQL, uploaded to cinode by cinodeUpload
#  * vector - vector tiles generated with Planetiler, see vectorMap,
#             requires postgres.enabled=false
mapType: raster

postgres:
  # PostgreSQL is only used by the raster map
  enabled: true

  # Bitnami publishes free images only with the rolling "latest" tag, the
  # image is pinned by digest to a known PostgreSQL / PostGIS version, it
  # has to be updated manually:
  #   docker buildx imagetools inspect docker.io/bitnami/postgresql:latest
  # PostgreSQL major upgrades need a new import (or pg_upgrade) since the
  # data directory of a previous major version can't be used.
  image:
    repository: bitnami/postgresql
    # PostgreSQL 18.7, PostGIS 3.6.4 (linux/amd64, linux/arm64)
    tag: latest
    digest: sha256:ec2ef1dfb067c66aa83081405438e80786b4fae4647ca94330e0fc94398b9207
  postgresqlDatabase: gis
  auth:
    username: renderer
    password: renderer
    database: gis
  primary:
    # The chart enables OpenSSL FIPS mode by default which disables md5(),
    # used by the queries of the openstreetmap-carto style
    fips:
      openssl: "off"

    #persistence:
    #  size: 1G
    #  # To automatically mount local directory, uncomment and use unique storageClass
    #  hostPath: /var/lib/cinode/osm/postgres
    #  storageClass: "cinode-maps-postgres-data"

    resources:
      requests: {}
      limits: {}

    # Rendered as a template, settings of the selected import tuning
    # profile are added at the end
    extendedConfiguration: |
      # Suggested minimal settings from
      # https://ircama.github.io/osm-carto-tutorials/tile-server-ubuntu/

      min_wal_size = 1GB

      # Suggested settings from
      # https://github.com/openstreetmap/chef/blob/master/roles/tile.rb#L38-L45

      max_connections = 250
      temp_buffers = 32MB
      work_mem = 128MB
      wal_buffers = 1024kB
      wal_writer_delay = 500ms
      commit_delay = 10000
      # checkpoint_segments = 60 # unrecognized in psql 10.7.1
      random_page_cost = 1.1
      track_activity_query_size = 16384
      autovacuum_vacuum_scale_factor = 0.05
      autovacuum_analyze_scale_factor = 0.02

      autovacuum = on

      # Import tuning profile: {{ .Values.global.importTuning.profile }}
      {{- range $k, $v := (index .Values.global.importTuning.profiles .Values.global.importTuning.profile).postgres }}
      {{ $k }} = {{ $v }}
      {{- end }}
      {{- if .Values.global.importTuning.noSync }}

      # Crash safety disabled with global.importTuning.noSync
      fsync = off
      full_page_writes = off
      synchronous_commit = off
      {{- end }}

    initdb:
      scripts:
        00_init_pg_stat_statements.sh: |
          #!/bin/sh
          export PGPASSWORD=$POSTGRES_POSTGRES_PASSWORD
          psql -U postgres -d gis -c "
            CREATE EXTENSION IF NOT EXISTS postgis;
            CREATE EXTENSION IF NOT EXISTS hstore;
            ALTER TABLE geometry_columns OWNER TO renderer;
            ALTER TABLE spatial_ref_sys OWNER TO renderer;
          "

    shmVolume:
      enabled: true
      # sizeLimit: 2Gi

tileServer:
  syncJob:
    enabled: true
    schedule: "* * * * *"
    allowDataWipe: false  # Controls whether data can be wiped and reimported when checksum changes

  webServer:
    enabled: true

    ingress:
      enabled: false
      hosts:
        - cinode-maps-source

    resources: {}

  image:
    registry: ghcr.io
    repository: cinode/maps-tile-server
    tag: "0.0.13"

  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: "OnRootMismatch"

  containerSecurityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false

  persistence:
    size: 1G
    accessModes:
      - ReadWriteOnce

cinodeUpload:
  enabled: true

  schedule: "0 0 * * 0"

  image:
    registry: ghcr.io
    repository: cinode/maps-tile-uploader
    tag: "0.0.13"

  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: "OnRootMismatch"

  containerSecurityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false

  minZoom: 0
  planetMaxZoom: 9
  defaultRegionMaxZoom: 14

  maxTileDownloadRetries: 200
  maxTileDownloadRetryDelaySec: 10

  datastore:
    value: "memory://"
    existingSecret: false
    secretName: ""
    secretKey: datastore

  writerInfo:
    value: ""
    existingSecret: false
    secretName: ""
    secretKey: writerinfo

regions:
  - enabled: true
    name: europe-luxembourg
    pbf: https://download.geofabrik.de/europe/luxembourg-latest.osm.pbf
    poly: https://download.geofabrik.de/europe/luxembourg.poly
    geoBBox:
      minLon: 5.726280
      minLat: 49.435092
      maxLon: 6.554718
      maxLat: 50.190968

  - enabled: true
    name: europe-luxembourg-city
    skipDownload: true
    geoBBox:
      minLon:  6.066685
      minLat: 49.560059
      maxLon:  6.203113
      maxLat: 49.654016
    maxZoom: 18
